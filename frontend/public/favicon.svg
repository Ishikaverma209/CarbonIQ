<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="20" fill="#0F0F0F"/>
  
  <!-- Outer atom orbital rings -->
  <ellipse cx="50" cy="50" rx="38" ry="14" transform="rotate(-30 50 50)" stroke="url(#teal)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <ellipse cx="50" cy="50" rx="38" ry="14" transform="rotate(30 50 50)" stroke="url(#teal)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <ellipse cx="50" cy="50" rx="38" ry="14" transform="rotate(90 50 50)" stroke="url(#teal)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Central 'C' letterform -->
  <path d="M58 35C54 30 48 27 42 27C32 27 24 35 24 45C24 55 32 63 42 63C48 63 54 60 58 55" stroke="url(#teal)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  
  <!-- AI node - diamond at center -->
  <rect x="46" y="46" width="8" height="8" rx="1.5" transform="rotate(45 50 50)" fill="url(#teal)"/>
  
  <!-- Data dots -->
  <circle cx="50" cy="18" r="2.5" fill="#14B8A6" opacity="0.8"/>
  <circle cx="78" cy="62" r="2" fill="#14B8A6" opacity="0.6"/>
  <circle cx="22" cy="62" r="2" fill="#14B8A6" opacity="0.6"/>
  
  <defs>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
</svg>
